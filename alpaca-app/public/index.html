<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalwright — Live Trading Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">◆</div>
        <div class="brand-text"><div class="brand-name">Signalwright</div><div class="brand-sub">live · paper trading</div></div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-tab="watchlist"><span class="nav-icon">◉</span> Live Watchlist</button>
        <button class="nav-item" data-tab="analyst"><span class="nav-icon">✦</span> AI Trade Analyst</button>
        <button class="nav-item" data-tab="allocator"><span class="nav-icon">◈</span> Put Money In</button>
        <button class="nav-item" data-tab="scanner"><span class="nav-icon">◎</span> Scanner</button>
        <button class="nav-item" data-tab="portfolio"><span class="nav-icon">▥</span> Portfolio</button>
        <button class="nav-item" data-tab="history"><span class="nav-icon">≡</span> Trade History</button>
        <button class="nav-item" data-tab="backtest"><span class="nav-icon">◫</span> Backtesting</button>
        <button class="nav-item" data-tab="settings"><span class="nav-icon">⚙</span> Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="mode-pill" id="mode-pill">CHECKING…</div>
        <div class="notif-status" id="conn-status">Connecting…</div>
      </div>
    </aside>
    <main class="content">
      <header class="topbar"><div class="topbar-title" id="page-title">Live Watchlist</div></header>
      <div class="page" id="page-watchlist"></div>
      <div class="page hidden" id="page-analyst"></div>
      <div class="page hidden" id="page-allocator"></div>
      <div class="page hidden" id="page-scanner"></div>
      <div class="page hidden" id="page-portfolio"></div>
      <div class="page hidden" id="page-history"></div>
      <div class="page hidden" id="page-backtest"></div>
      <div class="page hidden" id="page-settings"></div>
    </main>
  </div>
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/page_watchlist.js"></script>
  <script src="/js/page_analyst.js"></script>
  <script src="/js/page_scanner.js"></script>
  <script src="/js/pages_rest.js"></script>
</body>
</html>
